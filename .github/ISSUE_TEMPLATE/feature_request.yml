name: Feature Request
description: Suggest a new feature for CubicDB
title: "[Feature] "
labels: ["feature"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want and why?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: When would this be useful?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Optional. How do you think it could work?
