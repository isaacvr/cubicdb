name: Bug Report
description: Report a bug in CubicDB
title: "[Bug] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of what's wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: If reproducible, list the steps to trigger the bug.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g., Windows 11"

  - type: input
    id: version
    attributes:
      label: CubicDB Version
      placeholder: "e.g., 2.1.3"

  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Input device used when the bug occurred.
      options:
        - Keyboard
        - Stackmat
        - GAN iCarry
        - QY-Timer
        - Manual
        - Virtual
        - Other
      default: 0

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
